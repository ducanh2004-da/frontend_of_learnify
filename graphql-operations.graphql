# ==============================================================================
# Learnify Backend - Comprehensive GraphQL Operations & Fragments
# Ready for Frontend Integration (Apollo Client / URQL / TanStack Query) & Postman/Altair
# ==============================================================================

# ==============================================================================
# 1. CORE REUSABLE FRAGMENTS
# ==============================================================================

fragment UserFields on UserResponse {
  id
  username
  email
  phoneNumber
  avatar
  role
  currentSteak
  longestSteak
  diamond
  createdAt
  updatedAt
  learningDate
}

fragment CourseFields on CourseDto {
  id
  courseName
  abstract
  createdAt
  updatedAt
  keyLearnings
  status
}

fragment CoursePriceFields on CoursePriceDto {
  id
  originalPrice
  salePrice
  isFree
}

fragment LessonFields on LessonDto {
  id
  lessonName
  abstract
  courseId
  createdAt
  updatedAt
}

fragment ProgressFields on ProgressResponse {
  id
  userId
  courseId
  completedLessons
  totalLessons
  percentage
  status
  lastCompletedLessonId
  lastCompleteAt
  updatedAt
}

fragment ProgressLessonFields on ProgressLessonResponse {
  id
  userId
  courseId
  lessonId
  isUnlocked
  isCompleted
  completeAt
  lessonOrder
  createdAt
}

fragment NoteFields on NoteReturn {
  id
  title
  content
  enrollmentId
  createdAt
}

fragment DocumentFields on Document {
  id
  fileName
  fileUrl
  fileType
  fileSize
  publicId
  uploadedBy
  createdAt
  updatedAt
}

fragment PaymentFields on Payment {
  id
  userId
  courseId
  amount
  currency
  paymentStatus
  transactionId
  orderId
  payosOrderCode
  payosCheckoutUrl
  payosQrCode
  payosBin
  payosAccountNumber
  payosAccountName
  paidAt
  expiredAt
  createdAt
  updatedAt
}

fragment ReviewFields on Review {
  id
  rating
  content
  createdAt
  updatedAt
  user {
    ...UserFields
  }
}

fragment QuizFields on QuizResponse {
  id
  name
  lessonId
  createdAt
  updatedAt
  questions {
    id
    text
    order
    options {
      id
      text
      isCorrect
    }
  }
}

fragment NodeFields on NodeResponse {
  id
  title
  description
  order
}

fragment RoadmapFields on RoadmapDto {
  id
  roadMapName
  abstract
  isDeleted
  deletedAt
}

# ==============================================================================
# 2. AUTHENTICATION & USER QUERIES AND MUTATIONS
# ==============================================================================

mutation Register($data: RegisterInput!) {
  register(data: $data) {
    success
    message
  }
}

mutation Login($data: LoginInput!) {
  login(data: $data) {
    success
    message
    accessToken
    refreshToken
  }
}

mutation GoogleLogin($idToken: String!) {
  googleLogin(idToken: $idToken) {
    success
    message
    accessToken
    refreshToken
  }
}

mutation VerifyEmail($token: String!) {
  verifyEmail(token: $token) {
    success
    message
  }
}

mutation VerifyUserByEmail($email: String!) {
  verifyUserByEmail(email: $email) {
    success
    message
  }
}

mutation RefreshToken {
  refresh {
    success
    message
  }
}

mutation Logout {
  logout {
    success
    message
  }
}

query GetCurrentUser {
  currentUser {
    isSuccess
    count
    message
    users {
      ...UserFields
    }
  }
}

query GetUserById($userId: String!) {
  userById(userId: $userId) {
    ...UserFields
  }
}

query GetAllUsers {
  users {
    isSuccess
    count
    message
    users {
      ...UserFields
    }
  }
}

mutation CreateUser($data: CreateUserInput!) {
  createUser(data: $data) {
    ...UserFields
  }
}

mutation UpdateUser($data: UpdateUserInput!) {
  updateUser(data: $data) {
    isSuccess
    message
    users {
      ...UserFields
    }
  }
}

mutation UpdateUserAdmin($data: UpdateUserAdminInput!) {
  updateAdmin(data: $data) {
    ...UserFields
  }
}

mutation DeleteUser($id: String!) {
  deleteUser(id: $id)
}

