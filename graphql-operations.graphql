    isGroup
    createdAt
    participants {
      id
      userId
      joinedAt
    }
  }
}

# Realtime Subscription for incoming messages
subscription OnMessageAdded($conversationId: String!) {
  messageAdded(conversationId: $conversationId) {
    id
    content
    senderType
    conversationId
    timestamp
    response
  }
}

