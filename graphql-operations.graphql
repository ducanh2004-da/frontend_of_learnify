# Peer-to-Peer Chat & Socket Token Handshake
mutation CreateSocketToken {
  createSocketToken
}

mutation CreateConversationChat($userIds: [String!]!, $title: String) {
  createConversationChat(userIds: $userIds, title: $title) {
    id
